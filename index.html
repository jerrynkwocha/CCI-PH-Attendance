<style>
:root{--bg:#f8f6f5;--card:#fff;--ink:#1c1917;--mut:#78716c;--pri:#ad3229;--pri-d:#80221a;--tint:#faeeed;--ring:rgba(173,50,41,.18);--ok:#15803d;--bad:#b42318;--line:#e7e2e0}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.35 system-ui,sans-serif;padding-bottom:calc(150px + env(safe-area-inset-bottom))}
[hidden]{display:none!important}
header{position:sticky;top:0;z-index:5;background:var(--card);padding:calc(10px + env(safe-area-inset-top)) 14px 10px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line)}
header b{font-size:18px}
.pill{font-size:13px;font-weight:700;padding:6px 10px;border-radius:99px}
.saved{background:#dcfce7;color:#166534}.syncing{background:#fef3c7;color:#92400e}.offline{background:#e5e7eb;color:#374151}
.wrap{padding:12px 14px}
select,input{width:100%;min-height:52px;font:inherit;font-size:17px;padding:0 14px;border:1.5px solid var(--line);border-radius:14px;background:#fff;margin:0 0 10px}
.two,.seg,.seg2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.seg{margin-bottom:10px}.seg2{margin-bottom:10px}
.seg button,.seg2 button{min-height:52px;border:1.5px solid var(--line);background:#fff;border-radius:14px;font:inherit;font-weight:700}
.seg button.on,.seg2 button.on{background:var(--pri);border-color:var(--pri);color:#fff}
.row{width:100%;min-height:64px;display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:10px 16px;margin-bottom:8px;font:inherit;font-size:17px;text-align:left;color:var(--ink)}
.row small{display:block;color:var(--mut);font-size:14px}
.row i{font-style:normal;font-weight:700;color:var(--pri);white-space:nowrap}
.row.done{opacity:.55}.row.done i{color:var(--ok)}
.btn{display:flex;align-items:center;justify-content:center;width:100%;min-height:56px;border-radius:16px;border:1.5px solid var(--line);background:#fff;font:inherit;font-size:17px;font-weight:700;margin-top:10px;color:var(--ink);text-decoration:none}
.btn.primary{background:var(--pri);border-color:var(--pri);color:#fff}.btn.wa{background:#25d366;border-color:#25d366;color:#fff}.btn.ghost{border-color:transparent;color:var(--mut)}
.fab{position:fixed;right:14px;bottom:calc(84px + env(safe-area-inset-bottom));min-height:56px;padding:0 22px;border:0;border-radius:99px;background:var(--pri);color:#fff;font:inherit;font-size:17px;font-weight:700;box-shadow:0 6px 18px rgba(79,70,229,.4)}
nav{position:fixed;left:0;right:0;bottom:0;display:grid;grid-template-columns:repeat(4,1fr);background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav button{min-height:68px;border:0;background:none;font:inherit;font-size:13px;font-weight:700;color:var(--mut)}
nav button.on{color:var(--pri)}
.sheet{position:fixed;inset:0;background:rgba(17,24,39,.55);display:flex;align-items:flex-end;z-index:20}
.card{background:#fff;width:100%;max-height:92vh;overflow:auto;border-radius:24px 24px 0 0;padding:20px 16px calc(20px + env(safe-area-inset-bottom));text-align:center}
.card h2{margin:4px 0}.card details{text-align:left;margin-bottom:10px}.card summary{min-height:44px;display:flex;align-items:center;color:var(--mut);font-weight:600}
.tick{width:84px;height:84px;margin:0 auto 6px;border-radius:50%;background:var(--ok);color:#fff;font-size:52px;display:grid;place-items:center}
.code{font-size:72px;font-weight:800;letter-spacing:12px;margin:8px 0 4px;padding-left:12px}
.codein{text-align:center;font-size:32px;letter-spacing:10px}
.toast{position:fixed;left:14px;right:14px;top:calc(70px + env(safe-area-inset-top));z-index:30;padding:14px 16px;border-radius:14px;color:#fff;display:flex;justify-content:space-between;align-items:center;font-weight:700}
.toast.ok{background:var(--ok)}.toast.err{background:var(--bad)}
.toast button{background:rgba(255,255,255,.25);border:0;color:#fff;border-radius:10px;padding:12px 16px;font:inherit;font-weight:700}
.muted{color:var(--mut)}
.login{min-height:100vh;display:grid;align-content:center;padding:24px}
.left{text-align:left}.left h3{margin:14px 0 4px}.three{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.three .btn{margin-top:0}
.stat{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.src{background:#fff;border:1px solid var(--line);border-radius:16px;padding:12px;margin-bottom:10px}.src>select{margin:8px 0}
.map{display:grid;grid-template-columns:1fr 1.3fr;gap:8px;align-items:center;margin-bottom:6px;font-size:14px}.map select{margin:0;min-height:44px;font-size:15px}
.x{border:0;background:none;font-size:20px;min-width:44px;min-height:44px}.tbl{width:100%;font-size:13px;border-collapse:collapse;margin-top:8px}.tbl td{padding:5px 4px;border-top:1px solid var(--line)}
.mg{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0}.m{background:#fff;border:1px solid var(--line);border-radius:16px;padding:12px}.m b{display:block;font-size:26px}.m span{color:var(--mut);font-size:13px}
.hb{display:grid;grid-template-columns:84px 1fr 34px;gap:8px;align-items:center;margin:6px 0;font-size:14px}.hb div{background:#eef2ff;border-radius:8px;height:18px}.hb i{display:block;height:100%;background:var(--pri);border-radius:8px}.hb b{text-align:right}
.vb{display:flex;align-items:flex-end;gap:3px;height:130px;margin:10px 0 4px}.vb div{flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center}.vb small{font-size:10px;color:var(--mut)}.vb i{display:block;width:100%;background:var(--pri);border-radius:4px 4px 0 0}
.axis{display:flex;justify-content:space-between;font-size:12px;color:var(--mut)}.btn.warn{background:#fef3c7;border-color:#f59e0b;color:#92400e}
.lbl{display:block;text-align:left;margin:0 0 4px 4px;font-size:13px}
select{text-overflow:ellipsis}#branch,#service{font-size:16px}
.hd{display:flex;justify-content:space-between;align-items:center}.hd .x{color:var(--mut)}
.today{margin:0 0 10px;font-weight:700;font-size:17px}
.codein::placeholder{letter-spacing:0;font-size:18px}

/* ---- Celebteens brand theme ---- */
@font-face{font-family:Inter;src:url(inter.woff2) format('woff2');font-weight:100 900;font-display:swap}
body{font-family:Inter,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;-webkit-font-smoothing:antialiased}
.brand{display:flex;align-items:center;gap:10px}.brand img{width:36px;height:36px;border-radius:50%}
.row,.acc,.src,.m,.card{box-shadow:0 1px 2px rgba(28,25,23,.05)}
.btn,.row,.acc,.fab,.seg button,.seg2 button{transition:transform .08s,background .15s,border-color .15s}
.btn:active,.row:active,.acc:active,.fab:active{transform:scale(.98)}
.btn.primary:active,.fab:active{background:var(--pri-d)}
.btn.primary{box-shadow:0 4px 12px var(--ring)}
input:focus,select:focus{outline:none;border-color:var(--pri);box-shadow:0 0 0 3px var(--ring)}
.fab{box-shadow:0 8px 20px var(--ring)}
.hb div{background:var(--tint)}
.card{animation:up .22s ease-out}.sheet{animation:fade .2s}
@keyframes up{from{transform:translateY(28px);opacity:.4}}@keyframes fade{from{opacity:0}}
nav button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px}
nav svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.toast.err{background:#1c1917}.toast.err span::before{content:'⚠ '}
.login img{display:block;width:96px;height:96px;margin:0 auto 14px}.login h1{text-align:center;font-size:24px;margin:0 0 6px}.login p{text-align:center}
.acc{width:100%;min-height:56px;display:flex;justify-content:space-between;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:0 16px;margin:0 0 8px;font:inherit;font-weight:700;color:var(--ink);text-align:left}
.acc small{font-weight:600;margin-left:6px}
.chev{width:9px;height:9px;border-right:2px solid var(--mut);border-bottom:2px solid var(--mut);transform:rotate(45deg);margin:-3px 4px 0 0;transition:transform .15s}.chev.up{transform:rotate(225deg);margin-top:3px}
#report{margin-top:18px}
.rep{display:grid;grid-template-columns:1fr 52px 52px 58px;gap:6px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.rep b{text-align:center}.rep.h{font-size:12px;color:var(--mut);font-weight:700}.rep.h b{font-weight:700}.rep.t{font-weight:800}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.outrow i{color:var(--ok)}
.made{text-align:center;margin:28px 0 8px;font-size:13px;color:var(--mut)}.made a{color:var(--pri);font-weight:600;text-decoration:none;padding:6px 2px}
</style></head><body>

<div id="login" class="login" hidden>
  <img src="logo.png" alt="Celebteens" width="96" height="96">
  <h1>Celebteens PH CheckIn App</h1>
  <p class="muted" id="lmsg">Enter the team access code.</p>
  <input id="l-code" type="password" placeholder="Team access code" autocomplete="off">
  <input id="l-name" placeholder="Your name">
  <input id="l-pin" type="password" inputmode="numeric" placeholder="Admin PIN (admins only)">
  <button class="btn primary" id="l-go">Continue</button>
</div>

<div id="app" hidden>
  <header><div class="brand"><img src="logo.png" alt="" width="36" height="36"><b>Check In</b></div><span id="sync" class="pill saved">● Saved</span></header>
  <div class="wrap">
    <main id="checkin">
      <p id="today" class="today"></p>
      <div><select id="branch"></select><select id="service"></select></div>
      <div class="seg"><button id="t-in" class="on">Check In (<span id="cnt-in">0</span>)</button><button id="t-out">Check Out (<span id="cnt">0</span>)</button></div>
      <input id="q" type="search" placeholder="Search name…" autocomplete="off">
      <div id="list"></div>
      <div id="report"></div>
      <button class="fab" id="add">+ New teen</button>
    </main>
    <main id="records" hidden></main>
    <main id="dash" hidden></main>
    <main id="set" hidden></main>
    <main id="soon" hidden></main>
  </div>
  <nav>
    <button class="on" data-t="in"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg><span>Check In</span></button><button data-t="rec"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg><span>Records</span></button>
    <button data-t="dash"><svg viewBox="0 0 24 24" aria-hidden="true"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg><span>Dashboard</span></button><button data-t="set"><svg viewBox="0 0 24 24" aria-hidden="true"><line x1="4" y1="21" x2="4" y2="14"/><line x1="4" y1="10" x2="4" y2="3"/><line x1="12" y1="21" x2="12" y2="12"/><line x1="12" y1="8" x2="12" y2="3"/><line x1="20" y1="21" x2="20" y2="16"/><line x1="20" y1="12" x2="20" y2="3"/><line x1="1" y1="14" x2="7" y2="14"/><line x1="9" y1="8" x2="15" y2="8"/><line x1="17" y1="16" x2="23" y2="16"/></svg><span>Settings</span></button>
  </nav>
</div>
<div id="sheet" class="sheet" hidden></div>
<div id="toast" class="toast" hidden></div>

<script type="module">
import { createStore, todayStr, ageOf, svcAt, HOME } from './store.js';
import { APPS_SCRIPT_URL } from './config.js';
import { initRecords } from './records.js';
import { initDashboard } from './dashboard.js';
import { initSettings } from './settings.js';

const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const hm = iso => new Date(iso).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
const store = createStore({ url: APPS_SCRIPT_URL, onError: (op, e) => toast(e.message, 'err') });
let today = todayStr();
let V = store.view(), mode = 'in', q = '', ctx = JSON.parse(localStorage.getItem('att.ctx') || '{}');
let accT = null, lastOpenT = true, accR = false, accO = false; // Teenagers list: null = automatic (collapsed above 10)

/* ---------- small UI helpers ---------- */
let tt;
function toast(msg, kind = 'ok', undo) {
  const t = $('#toast'); t.className = 'toast ' + kind;
  t.innerHTML = `<span>${kind === 'ok' ? '✓ ' : ''}${esc(msg)}</span>${undo ? '<button id="tu">Undo</button>' : ''}`;
  t.hidden = false;
  if (undo) $('#tu').onclick = () => { undo(); t.hidden = true; };
  clearTimeout(tt); tt = setTimeout(() => t.hidden = true, undo ? 5000 : 3000);
}
const sheet = html => { $('#sheet').innerHTML = `<div class="card">${html}</div>`; $('#sheet').hidden = false; };
const closeSheet = () => $('#sheet').hidden = true;
const pill = s => {
  const p = $('#sync'), n = V.queued ? ` (${V.queued})` : '';
  p.className = 'pill ' + s;
  p.textContent = s === 'saved' ? '● Saved' : s === 'syncing' ? '● Syncing' + n : '● Offline' + n;
};

/* ---------- branch / service context (remembered per device) ---------- */
function fill(sel, opts, val) {
  const el = $(sel), h = opts.map(([v, t]) => `<option value="${esc(v)}">${esc(t)}</option>`).join('');
  if (el.dataset.h !== h) { el.innerHTML = h; el.dataset.h = h; }
  el.value = val;
}
const services = () => V.services.filter(s => svcAt(s, ctx.branchId));
function fixCtx() {
  if (!V.branches.length) return;
  if (!V.branches.some(b => b.id === ctx.branchId)) { ctx.branchId = V.branches[0].id; ctx.serviceId = ''; }
  const sv = services();
  if (!sv.some(s => s.id === ctx.serviceId)) ctx.serviceId = sv[0]?.id || '';
  localStorage.setItem('att.ctx', JSON.stringify(ctx));
  fill('#branch', V.branches.map(b => [b.id, b.name]), ctx.branchId);
  fill('#service', sv.map(s => [s.id, `${s.name} · ${s.day} ${s.time}`]), ctx.serviceId);
}
$('#branch').onchange = e => { accT = null; ctx.branchId = e.target.value; ctx.serviceId = ''; render(); };
$('#service').onchange = e => { accT = null; ctx.serviceId = e.target.value; render(); };

/* ---------- list rendering ---------- */
function render() {
  const d = todayStr();
  if (d !== today) { today = d; store.start(today); } // app left open overnight: move to the new day
  $('#today').textContent = new Date().toLocaleDateString([], { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
  fixCtx();
  const list = $('#list');
  if (!ctx.serviceId) { list.innerHTML = '<p class="muted">Add a branch and a service in Settings (Admin PIN) to start.</p>'; return; }
  const tm = new Map(V.teens.map(t => [t.id, t]));
  const here = V.attendance.filter(r => r.serviceId === ctx.serviceId && r.date === today && r.status !== 'void');
  const att = here.filter(r => r.branchId === ctx.branchId);
  const open = att.filter(r => !r.checkOut), byTeen = new Map(here.map(r => [r.teenId, r]));
  const words = q.toLowerCase().split(/\s+/).filter(Boolean), hit = n => words.every(w => n.toLowerCase().includes(w));
  $('#cnt-in').textContent = att.length; $('#cnt').textContent = att.length - open.length; // Check In = everyone checked in; Check Out = how many have left $('#q').hidden = false; $('#report').innerHTML = V.role === 'admin' ? reportHtml() : ''; // report is for admins only
  if (mode === 'in') {
    const rows = V.teens.filter(t => t.status !== 'archived' && hit(t.fullName)).sort((a, b) => a.fullName.localeCompare(b.fullName)).slice(0, 40);
    list.innerHTML = rows.map(t => {
      const a = byTeen.get(t.id);
      return `<button class="row ${a ? 'done' : ''}" data-t="${esc(t.id)}" ${a ? 'disabled' : ''}><span><b>${esc(t.fullName)}</b><small>${esc([ageOf(t) || '', t.gender].filter(Boolean).join(' · '))}</small></span><i>${a ? (a.branchId !== ctx.branchId ? 'At ' + (V.branches.find(b => b.id === a.branchId)?.name || 'other branch') : a.checkOut ? 'Out' : '✓ In') : 'Check in'}</i></button>`;
    }).join('') || '<p class="muted">No match. Tap “+ New teen”.</p>';
  } else {
    const rows = open.map(a => ({ a, n: tm.get(a.teenId)?.fullName || 'Unknown' })).filter(x => hit(x.n)).sort((x, y) => x.n.localeCompare(y.n));
    const openT = accT === null ? open.length <= 10 : accT; lastOpenT = openT;
    const outRows = att.filter(r => r.checkOut).map(a => ({ a, n: tm.get(a.teenId)?.fullName || 'Unknown' })).filter(x => hit(x.n)).sort((x, y) => y.a.checkOut.localeCompare(x.a.checkOut));
    const outHtml = `<button class="acc" data-acc="o" style="margin-top:10px"><span>Checked out <small class="muted">${att.length - open.length}</small></span><em class="chev ${accO ? 'up' : ''}"></em></button>` +
      (accO ? outRows.map(({ a, n }) => `<div class="row outrow"><span><b>${esc(n)}</b><small>In ${hm(a.checkIn)} · Out ${hm(a.checkOut)}${a.pending ? ' · syncing' : ''}</small></span><i>✓ Out</i></div>`).join('') || '<p class="muted">Nobody checked out yet.</p>' : '');
    const body = (open.length ? `<button class="btn warn" id="co-all">End of service: check out all (${open.length})</button>` : '') + rows.map(({ a, n }) => `<button class="row" data-a="${esc(a.id)}"><span><b>${esc(n)}</b><small>In ${hm(a.checkIn)}${a.pending ? ' · syncing' : ''}</small></span><i>Check out</i></button>`).join('') || '<p class="muted">Nobody checked in yet.</p>';
    list.innerHTML = `<button class="acc" data-acc="t"><span>Teenagers <small class="muted">${open.length} still in</small></span><em class="chev ${openT ? 'up' : ''}"></em></button>` + (openT ? body : '') + outHtml;
    $('#q').hidden = !openT;
  }
}
$('#list').onclick = e => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.dataset.acc === 'o') { accO = !accO; return render(); }
  if (b.dataset.acc) { accT = !lastOpenT; return render(); }
  if (b.id === 'co-all') return coAll();
  if (b.dataset.t) {
    const t = V.teens.find(x => x.id === b.dataset.t); if (!t) return;
    checkInTeen(t.fullName, t.id.startsWith('tmp_') ? { teenRefOpId: t.id.slice(4) } : { teenId: t.id }, t.guardianPhone);
  } else openOut(b.dataset.a);
};
function reportHtml() {
  const rows = V.attendance.filter(r => r.date === today && r.status !== 'void');
  const cnt = a => [a.length, a.filter(r => r.checkOut).length];
  const mine = rows.filter(r => r.branchId === ctx.branchId), [tin, tout] = cnt(mine);
  const line = (k, a, b, c, cls = '') => `<div class="rep ${cls}"><span>${esc(k)}</span><b>${a}</b><b>${b}</b><b>${c}</b></div>`;
  let h = `<button class="acc" data-acc="r"><span>Report for today <small class="muted">${tin} in · ${tout} out</small></span><em class="chev ${accR ? 'up' : ''}"></em></button>`;
  if (!accR) return h;
  const bn = V.branches.find(b => b.id === ctx.branchId)?.name || '';
  h += `<div class="src"><b>${new Date().toLocaleDateString([], { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' })}</b><p class="muted" style="margin:2px 0 6px">${esc(bn)}</p>` + line('Service', 'In', 'Out', 'Still in', 'h');
  V.services.filter(s => svcAt(s, ctx.branchId)).forEach(s => { const [i, o] = cnt(mine.filter(r => r.serviceId === s.id)); h += line(s.name, i, o, i - o); });
  h += line('Total', tin, tout, tin - tout, 't');
  if (V.branches.length > 1) {
    h += `<p style="margin:14px 0 2px"><b>All campuses today</b></p>` + line('Campus', 'In', 'Out', 'Still in', 'h');
    V.branches.forEach(b => { const [i, o] = cnt(rows.filter(r => r.branchId === b.id)); h += line(b.name, i, o, i - o); });
  }
  return h + '</div>';
}
$('#report').onclick = e => { if (e.target.closest('[data-acc]')) { accR = !accR; render(); } };
function coAll() {
  const n = V.attendance.filter(r => r.serviceId === ctx.serviceId && r.branchId === ctx.branchId && r.date === today && r.status !== 'void' && !r.checkOut).length;
  if (n && confirm(`Check out all ${n} teens still in? Do this at the end of service.`)) { store.checkOutAll({ serviceId: ctx.serviceId, branchId: ctx.branchId, date: today }); toast(`${n} teens checked out`); }
}
$('#q').oninput = e => { q = e.target.value; render(); };
const setMode = m => { mode = m; $('#t-in').classList.toggle('on', m === 'in'); $('#t-out').classList.toggle('on', m === 'out'); $('#add').hidden = m !== 'in'; render(); };
$('#t-in').onclick = () => setMode('in'); $('#t-out').onclick = () => setMode('out');

/* ---------- check in + guardian code ---------- */
function checkInTeen(name, ref, phone) {
  const r = store.checkIn({ branchId: ctx.branchId, serviceId: ctx.serviceId, date: today, ...ref });
  const svc = V.services.find(s => s.id === ctx.serviceId)?.name || 'service';
  const msg = `${name} is checked in at ${svc}. Pickup code: ${r.guardianCode}`;
  const d = phone ? String(phone).replace(/\D/g, '').replace(/^0/, '234') : '';
  sheet(`<div class="tick">✓</div><h2>${esc(name)}</h2><p class="muted">Checked in at ${hm(new Date().toISOString())} · give this code to the guardian</p>
    <div class="code">${r.guardianCode}</div>
    <a class="btn wa" target="_blank" rel="noopener" href="https://wa.me/${d}?text=${encodeURIComponent(msg)}">Share via WhatsApp</a>
    <a class="btn" href="sms:${d ? '+' + d : ''}?&body=${encodeURIComponent(msg)}">Share via SMS</a>
    <button class="btn ghost" id="undo">Undo check-in</button><button class="btn primary" id="done">Done</button>`);
  $('#done').onclick = closeSheet;
  $('#undo').onclick = () => { store.undoCheckIn({ id: 'tmp_' + r.opId, opId: r.opId }); closeSheet(); toast('Check-in undone'); };
}

/* ---------- check out ---------- */
function openOut(aid) {
  const a = V.attendance.find(r => r.id === aid); if (!a) return;
  const name = V.teens.find(t => t.id === a.teenId)?.fullName || 'Unknown';
  sheet(`<h2>${esc(name)}</h2><p class="muted">In since ${hm(a.checkIn)}</p>
    ${a.guardianCode ? '<button class="btn" id="showcode">Show pickup code</button>' : ''}
    <input id="code" class="codein" inputmode="numeric" maxlength="4" placeholder="Code (optional)" autocomplete="off">
    <input id="note" placeholder="Note (optional)">
    <p class="muted" style="margin:0">Leave the code blank if the guardian does not have it.</p>
    <button class="btn primary" id="go">Check out</button><button class="btn ghost" id="x">Cancel</button>`);
  const sc = $('#showcode'); if (sc) sc.onclick = () => { sc.outerHTML = `<div class="code" style="font-size:52px;margin:6px 0">${esc(a.guardianCode)}</div>`; };
  const finish = () => { closeSheet(); toast(`${name} checked out`, 'ok', () => store.undoCheckOut(a)); };
  $('#go').onclick = async () => {
    const code = $('#code').value.trim();
    if (!code) { store.checkOut(a, { note: $('#note').value.trim(), skipCode: true }); return finish(); } // blank = code skipped
    if (!/^\d{4}$/.test(code)) return toast('The code is 4 digits. Leave it blank to skip.', 'err');
    if (!navigator.onLine) return toast('Offline: leave the code blank, or reconnect', 'err');
    $('#go').disabled = true;                         // the server verifies the code, so wait for its answer
    try { await store.checkOut(a, { note: $('#note').value.trim(), code }).done; finish(); }
    catch { $('#go').disabled = false; }              // bad code: the error toast already shows
  };
  $('#x').onclick = closeSheet;
}

/* ---------- quick add ---------- */
$('#add').onclick = () => {
  let g = '', ft = '';
  sheet(`<div class="hd"><h2>New teen</h2><button class="x" id="n-x" aria-label="Close">✕</button></div>
    <input id="n-name" placeholder="Full name *" autocomplete="off">
    <div class="seg2" id="n-g"><button data-g="Male">Male</button><button data-g="Female">Female</button></div>
    <div class="two"><div><small class="muted lbl">Age</small><input id="n-age" type="number" inputmode="numeric" placeholder="Age"></div><div><small class="muted lbl">Birthday</small><input id="n-dob" type="date"></div></div>
    <input id="n-ph" type="tel" placeholder="Teen's phone *">
    <select id="n-hb"><option value="">${HOME}</option>${V.branches.map(b => `<option value="${esc(b.id)}"${b.id === ctx.branchId ? ' selected' : ''}>${esc(b.name)}</option>`).join('')}</select>
    <p class="muted lbl">Is this their first time visiting?</p>
    <div class="seg2" id="n-ft"><button data-f="yes">Yes, first time</button><button data-f="no">No, been before</button></div>
    <details><summary>More details (optional)</summary>
      <input id="n-gp" type="tel" placeholder="Guardian phone"><input id="n-gn" placeholder="Guardian name"><input id="n-med" placeholder="Allergies / medical notes">
    </details>
    <button class="btn primary" id="save">Save &amp; check in</button><button class="btn ghost" id="x">Cancel</button>`);
  $('#n-name').value = q; $('#n-x').onclick = closeSheet;
  document.querySelectorAll('#n-g button, #n-ft button').forEach(b => b.onclick = () => {
    b.parentElement.querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b));
    if (b.dataset.g) g = b.dataset.g; else ft = b.dataset.f;
  });
  $('#x').onclick = closeSheet;
  $('#save').onclick = () => {
    const v = id => $(id).value.trim(), fullName = v('#n-name'), age = v('#n-age'), dob = v('#n-dob'), phone = v('#n-ph'), guardianPhone = v('#n-gp');
    if (!fullName || !g || !phone || (!age && !dob) || !ft) return toast('Name, gender, teen phone, age or birthday, and first-time answer are required', 'err');
    const a = store.addTeen({ fullName, gender: g, age, dob, phone, guardianPhone, guardianName: v('#n-gn'), medicalNotes: v('#n-med'), homeBranchId: $('#n-hb').value, firstTimer: ft });
    $('#q').value = q = '';
    checkInTeen(fullName, { teenRefOpId: a.opId }, guardianPhone || phone);
  };
};

/* ---------- bottom nav (other modules arrive in later stages) ---------- */
document.querySelectorAll('nav button').forEach(b => b.onclick = () => {
  document.querySelectorAll('nav button').forEach(x => x.classList.toggle('on', x === b));
  const ci = b.dataset.t === 'in';
  const t = b.dataset.t; ['in:#checkin', 'rec:#records', 'dash:#dash', 'set:#set'].forEach(x => { const [k, id] = x.split(':'); $(id).hidden = t !== k; }); $('#soon').hidden = true; $('#add').hidden = !ci || mode !== 'in';
  $('header b').textContent = b.querySelector('span').textContent;
  ({ rec: records, dash, set: settings })[t]?.show();
});

const records = initRecords({ store, getV: () => V, esc, toast, sheet, closeSheet });
const dash = initDashboard({ store, getV: () => V, esc, toast, unlock: records.unlock });
const settings = initSettings({ store, getV: () => V, esc, toast, sheet, closeSheet, unlock: records.unlock });

/* ---------- login + boot ---------- */
function showLogin(msg) {
  $('#app').hidden = true; $('#login').hidden = false; $('#l-name').value = store.auth.usher || '';
  if (msg) $('#lmsg').textContent = msg;
}
function enter() { $('#login').hidden = true; $('#app').hidden = false; store.start(today); render(); }
$('#l-go').onclick = async () => {
  const b = $('#l-go'); b.disabled = true;
  try { await store.login($('#l-code').value.trim(), $('#l-pin').value.trim() || undefined, $('#l-name').value.trim() || 'Usher'); enter(); }
  catch (e) { $('#lmsg').textContent = e.message; }
  b.disabled = false;
};
store.subscribe((v, s) => {
  V = v; pill(s);
  if (store.locked && $('#login').hidden) showLogin('Access code changed. Enter the new one.');
  render(); records.onData(); dash.onData(); settings.onData();
});
if (store.auth.code || store.auth.pin) enter(); else showLogin();
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
</script>
</body></html>
